[package]
name = "clutch"
author = "polymorphia"
version = "1.0.0"
description = "A process manager for Flywheel: start, supervise, and control programs together"
main = "clutch.fw"
license = "MIT"
exclude = ["tests/*", ".gitignore", "logs/*"]

[dependencies]
cogwheel = "polymorphia.cogwheel=^1.0"

[scripts]
test = "flywheel --test tests/"

[commands]
clutch = "cli.fw"
